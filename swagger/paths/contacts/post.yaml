tags:
  - Contacts
summary: Create contact
operationId: createContact
description: Create a new contact with name, phone number, and optional fields like email, contact type, or photo.
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
        properties:
          name:
            type: string
            description: Contact name.
            example: 'John Doe'
          phoneNumber:
            type: string
            description: Contact phone number.
            example: '+380970002219'
          email:
            type: string
            description: Contact email address.
            format: email
            example: 'john.doe@example.com'
          isFavourite:
            type: boolean
            description: Mark contact as favorite.
            example: true
          contactType:
            type: string
            description: Contact type.
            enum: [work, home, personal]
            example: 'personal'
          photo:
            type: string
            description: (Optional) Contact photo.
            format: binary
responses:
  '201':
    description: Successfully created a contact.
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: 'Successfully created a contact!'
            data:
              $ref: '../../components/schemas/contact.yaml'
  '400':
    $ref: '../../components/responses/400.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
