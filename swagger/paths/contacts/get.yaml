tags:
  - Contacts
summary: Get list of contacts
operationId: getContacts
description: Get contacts records. You can use query parameters
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    description: Page number for pagination.
    schema:
      type: integer
      example: 1
      default: 1
  - in: query
    name: perPage
    description: Number of contacts to return per page.
    schema:
      type: integer
      example: 5
      default: 10
  - in: query
    name: sortBy
    description: Field to sort contacts by.
    schema:
      type: string
      enum: ['_id', 'name', 'phoneNumber', 'contactType', 'isFavourite']
      example: 'name'
      default: '_id'
  - in: query
    name: sortOrder
    description: Sort direction ascending or descending.
    schema:
      type: string
      enum: ['asc', 'desc']
      default: 'asc'
      example: 'asc'
  - in: query
    name: isFavourite
    description: Filter by favorite status (true or false).
    schema:
      type: boolean
      example: true
  - in: query
    name: contactType
    description: Filter by contact type.
    schema:
      type: string
      enum: ['work', 'home', 'personal']
      example: home
responses:
  '200':
    description: Successfully retrieved contacts.
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: object
              required:
                - data
                - page
                - perPage
                - totalItems
                - totalPages
                - hasPreviousPage
                - hasNextPage
              properties:
                data:
                  type: array
                  items:
                    $ref: ../../components/schemas/contact.yaml
                page:
                  type: integer
                  example: 1
                perPage:
                  type: integer
                  example: 10
                totalItems:
                  type: integer
                  example: 4
                totalPages:
                  type: integer
                  example: 1
                hasPreviousPage:
                  type: boolean
                  example: false
                hasNextPage:
                  type: boolean
                  example: true
  '401':
    $ref: ../../components/responses/401.yaml
